api_platform:
    title: 'CYNA API'
    description: 'API REST pour la plateforme CYNA - Services SaaS de cybersécurité'
    version: '1.0.0'
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
        jsonapi: ['application/vnd.api+json']
    docs_formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
        html: ['text/html']

